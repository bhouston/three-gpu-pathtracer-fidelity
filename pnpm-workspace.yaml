packages:
  - packages/*
  - submodules/three-gpu-pathtracer

allowBuilds:
  esbuild: true
  sharp: true
  webgpu: true
  '@onirenaud/node-webgl': true
  puppeteer: false

link-workspace-packages: false

# one copy of three everywhere (three-mesh-bvh, three-gpu-pathtracer, scenes, renderers): plain npm three
overrides:
  three: '^0.186.0'
  '@types/three': '^0.186.0'
