name: Deploy three-gpu-pathtracer-fidelity to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy three-gpu-pathtracer-fidelity to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      # Uses the fidelity-kit range from package.json without installing the workspace (which needs submodules).
      - run: npx -y "fidelity-kit@$(node -p "require('./package.json').devDependencies['fidelity-kit']")" build results --out site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
